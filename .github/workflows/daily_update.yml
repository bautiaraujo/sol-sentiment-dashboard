name: Daily Pipeline Update

on:
  schedule:
    - cron: "0 6 * * *"   # 06:00 UTC = 03:00 Buenos Aires
  workflow_dispatch:        # trigger manual desde GitHub

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install pandas numpy scikit-learn xgboost scipy \
                      yfinance praw \
                      transformers torch --index-url https://download.pytorch.org/whl/cpu

      - name: Fetch Solana prices (Yahoo Finance)
        run: python src/get_prices.py

      - name: Fetch Reddit posts
        env:
          REDDIT_CLIENT_ID:     ${{ secrets.REDDIT_CLIENT_ID }}
          REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
          REDDIT_USER_AGENT:    ${{ secrets.REDDIT_USER_AGENT }}
        run: python src/get_reddit.py

      - name: Run sentiment analysis (RoBERTa)
        run: python src/sentiment.py

      - name: Export dashboard data + forecast 7d
        run: python export_for_dashboard.py

      - name: Commit and push updated data
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add dashboard/public/data/dashboard_data.json data/
          git diff --quiet && git diff --staged --quiet \
            || git commit -m "chore: daily update $(date -u +'%Y-%m-%d')"
          git push
